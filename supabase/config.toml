# Configuración de las Edge Functions.
#
# `verify_jwt` decide si Supabase exige un token de sesión ANTES de que la
# función corra. El valor por omisión es `true`, que es lo correcto para
# todo lo que llama la app; acá solo aparecen las excepciones y por qué lo
# son. Si una función que recibe avisos de afuera queda con la verificación
# puesta, el proveedor recibe 401 y el pago se pierde en silencio.

[functions.pagar-reserva]
# La llama la app con la sesión del jugador. La función usa ese mismo token
# para iniciar el pago, así que sin sesión no tiene nada que hacer.
verify_jwt = true

[functions.flow-confirmacion]
# El aviso de servidor a servidor de Flow. Flow no tiene ni puede tener una
# sesión de Supabase. Lo que protege esta URL no es un token de entrada: es
# que la función no le cree al POST y vaya a preguntarle a Flow con una
# consulta firmada con la Secret Key.
verify_jwt = false

[functions.flow-retorno]
# El navegador del jugador volviendo de Flow, con un POST y sin token. No
# lee ni escribe nada: solo muestra una página que rebota a la app.
verify_jwt = false

[functions.send-push]
# La dispara un Database Webhook de Supabase, que sí manda la service key.
verify_jwt = true

[functions.solicitud-recinto]
# La llama la app con la sesión de quien manda el formulario, y la función
# usa ese mismo token para crear la solicitud: sin sesión no tiene nada que
# hacer. El correo al equipo lo manda después, con sus propios secretos.
verify_jwt = true

# ── Correo del stack LOCAL ───────────────────────────────────────
# OJO: el stack local NO se levanta desde este directorio, sino desde
# `~/.futfinder-local`, que tiene una copia de estas líneas. Vive aparte a
# propósito: si el `config.toml` del stack estuviera acá, `supabase db reset`
# aplicaría `supabase/migrations/` en orden ALFABÉTICO —la 100 entre la 09 y
# la 10, la 44b antes que la 44— y construiría una base distinta sin avisar.
# La base se arma con `node scripts/construir-base.mjs`, que sabe el orden.
#
# Esto queda versionado como referencia, y funciona si alguna vez se levanta
# desde acá. Las plantillas de producción viven en el panel y no se pueden
# versionar desde ningún lado.
#
# La pantalla de verificación espera un CÓDIGO DE 6 DÍGITOS, no un enlace
# (ver `src/services/auth.js`). La plantilla por omisión del stack local
# manda un enlace mágico, y con eso el registro local queda a medias de una
# forma que parece un fallo de la app: la cuenta se crea y la contraseña
# nunca se fija —se fija al verificar el código—, así que el login siguiente
# contesta «Correo o contraseña incorrectos».
#
# Detalle y motivo de cada línea en `supabase/plantillas-correo/LEEME.md`.

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Tu código de FutFinder"
content_path = "./supabase/plantillas-correo/confirmacion.html"

# La misma plantilla a propósito: «Reenviar código» va por `signInWithOtp`,
# así que Supabase manda la de magic_link. Si sólo se cambiara la de arriba,
# el primer correo traería el código y el del reenvío un enlace.
[auth.email.template.magic_link]
subject = "Tu código de FutFinder"
content_path = "./supabase/plantillas-correo/confirmacion.html"
